# Once a day: phone alert when the queue is under 14 days or the reserve is low.
name: daily-check
on:
  schedule:
    - cron: "7 14 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: vars.PUBLISHER_ON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m social_studio check-queue
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
